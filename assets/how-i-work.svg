<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Niyam evidence-first workflow</title><desc id="d">A compact editorial workflow from problem to proof, break test, evidence review, bounded ship, and measurement.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="56" y="62" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">HOW I WORK</text>
<text x="56" y="105" fill="#171714" font-family="Georgia,serif" font-size="34">Build the smallest thing that can prove me wrong.</text>

<g font-family="Arial,sans-serif">
  <rect x="58" y="175" width="185" height="94" rx="14" fill="#fff" stroke="#171714" stroke-width="2"/>
  <text x="80" y="206" fill="#71716a" font-size="12" letter-spacing="2">INPUT</text>
  <text x="80" y="237" fill="#171714" font-size="21" font-weight="700">Problem</text>

  <rect x="294" y="175" width="205" height="94" rx="14" fill="#fff" stroke="#171714" stroke-width="2"/>
  <text x="316" y="206" fill="#71716a" font-size="12" letter-spacing="2">CHEAPEST TEST</text>
  <text x="316" y="237" fill="#171714" font-size="21" font-weight="700">Small proof</text>

  <rect x="550" y="175" width="205" height="94" rx="14" fill="#f1d9dc" stroke="#a4243b" stroke-width="2"/>
  <text x="572" y="206" fill="#a4243b" font-size="12" letter-spacing="2">ATTACK IT</text>
  <text x="572" y="237" fill="#171714" font-size="21" font-weight="700">Try to break it</text>

  <rect x="806" y="150" width="170" height="145" rx="14" fill="#fff" stroke="#171714" stroke-width="2"/>
  <text x="828" y="183" fill="#71716a" font-size="12" letter-spacing="2">DECISION</text>
  <text x="828" y="216" fill="#171714" font-size="21" font-weight="700">Evidence?</text>
  <line x1="828" y1="236" x2="952" y2="236" stroke="#d8d8d1"/>
  <text x="828" y="262" fill="#596e35" font-size="13" font-weight="700">YES → ship bounded</text>
  <text x="828" y="284" fill="#a4243b" font-size="13" font-weight="700">NO → narrow / kill</text>

  <rect x="1018" y="175" width="130" height="94" rx="14" fill="#e4edb0" stroke="#596e35" stroke-width="2"/>
  <text x="1040" y="206" fill="#596e35" font-size="12" letter-spacing="2">AFTER</text>
  <text x="1040" y="237" fill="#171714" font-size="21" font-weight="700">Measure</text>
</g>

<g stroke="#171714" stroke-width="2" fill="none" stroke-linecap="round">
  <path d="M243 222 H294"/><path d="M499 222 H550"/><path d="M755 222 H806"/><path d="M976 222 H1018"/>
</g>
<g fill="#171714">
  <path d="M286 216 l10 6 -10 6z"/><path d="M542 216 l10 6 -10 6z"/><path d="M798 216 l10 6 -10 6z"/><path d="M1010 216 l10 6 -10 6z"/>
</g>

<path d="M891 295 V358 H398 V269" fill="none" stroke="#a4243b" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M398 277 l-6 -10 h12z" fill="#a4243b"/>
<text x="625" y="350" text-anchor="middle" fill="#a4243b" font-family="Arial,sans-serif" font-size="13">weak evidence loops back into another cheaper test</text>

<rect x="58" y="390" width="1090" height="64" rx="12" fill="#262722"/>
<text x="82" y="417" fill="#d8d8d1" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">RULE</text>
<text x="82" y="439" fill="#fff" font-family="Georgia,serif" font-size="19">Do not decorate weak evidence. Fix the idea first.</text>
</svg>