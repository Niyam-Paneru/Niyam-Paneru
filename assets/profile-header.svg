<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Niyam Paneru</title>
  <desc id="desc">Backend systems, AI automation, voice, and reliability</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>

  <circle cx="1000" cy="75" r="120" fill="#22d3ee" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1065" cy="245" r="115" fill="#8b5cf6" fill-opacity="0.12" filter="url(#glow)"/>

  <rect x="72" y="62" width="98" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="132" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1.5">NIYAM PANERU</text>
  <text x="74" y="176" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500">Backend systems · AI automation · realtime voice · reliability</text>

  <g font-family="Consolas, Menlo, monospace" font-size="16" font-weight="600">
    <rect x="74" y="218" width="172" height="42" rx="21" fill="#111827" stroke="#334155"/>
    <text x="160" y="244" fill="#7dd3fc" text-anchor="middle">evidence &gt; hype</text>

    <rect x="260" y="218" width="224" height="42" rx="21" fill="#111827" stroke="#334155"/>
    <text x="372" y="244" fill="#67e8f9" text-anchor="middle">fail closed &gt; fail vague</text>

    <rect x="498" y="218" width="206" height="42" rx="21" fill="#111827" stroke="#334155"/>
    <text x="601" y="244" fill="#c4b5fd" text-anchor="middle">proof before claims</text>
  </g>

  <g transform="translate(920,118)">
    <path d="M0 40 H85" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M55 10 L85 40 L55 70" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="40" r="8" fill="#60a5fa"/>
    <circle cx="110" cy="40" r="8" fill="#a78bfa"/>
    <path d="M110 40 H175" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>