<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">How Niyam decides what to ship</title><desc id="d">Three overlapping circles: small enough to test, important enough to matter, and strong enough evidence. Their overlap is ship.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="58" y="64" fill="#71716a" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">HOW I WORK</text>
<text x="58" y="108" fill="#171714" font-family="Georgia,serif" font-size="35">Build where the three circles overlap.</text>
<circle cx="465" cy="288" r="150" fill="#e4edb0" fill-opacity=".78" stroke="#596e35" stroke-width="2"/>
<circle cx="620" cy="288" r="150" fill="#dce9de" fill-opacity=".78" stroke="#4f7555" stroke-width="2"/>
<circle cx="542" cy="385" r="150" fill="#f1d9dc" fill-opacity=".78" stroke="#a4243b" stroke-width="2"/>
<text x="405" y="244" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="19" font-weight="700">small enough</text><text x="405" y="270" text-anchor="middle" fill="#4e4e48" font-family="Arial,sans-serif" font-size="16">to test cheaply</text>
<text x="680" y="244" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="19" font-weight="700">important enough</text><text x="680" y="270" text-anchor="middle" fill="#4e4e48" font-family="Arial,sans-serif" font-size="16">to matter</text>
<text x="542" y="438" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="19" font-weight="700">evidence strong enough</text><text x="542" y="464" text-anchor="middle" fill="#4e4e48" font-family="Arial,sans-serif" font-size="16">to trust</text>
<circle cx="542" cy="323" r="52" fill="#171714"/><text x="542" y="318" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">SHIP</text><text x="542" y="342" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13">bounded version</text>
<text x="1000" y="442" text-anchor="end" fill="#71716a" font-family="Arial,sans-serif" font-size="14">break it first → then believe it</text>
</svg>