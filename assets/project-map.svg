<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">Niyam project map</title>
<desc id="d">A project map grouping public work into control boundaries, realtime systems, and memory/evidence systems.</desc>
<rect width="1200" height="500" fill="#f5f5f1"/>
<text x="58" y="62" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">SELECTED WORK</text>
<text x="58" y="104" fill="#171714" font-family="Georgia,serif" font-size="34">Different projects. Same obsession: make the boundary explicit.</text>

<g font-family="Arial,sans-serif">
  <rect x="58" y="155" width="330" height="252" rx="18" fill="#fff" stroke="#171714" stroke-width="2"/>
  <text x="84" y="190" fill="#596e35" font-size="12" letter-spacing="2">CONTROL BOUNDARIES</text>
  <text x="84" y="224" fill="#171714" font-family="Georgia,serif" font-size="24">Agents that know when to stop.</text>
  <line x1="84" y1="244" x2="360" y2="244" stroke="#d8d8d1"/>
  <text x="84" y="278" fill="#171714" font-size="16" font-weight="700">agent-policy-core</text>
  <text x="84" y="309" fill="#171714" font-size="16" font-weight="700">attended-browser-bridge</text>
  <text x="84" y="340" fill="#171714" font-size="16" font-weight="700">human-gated-research</text>
  <text x="84" y="376" fill="#71716a" font-size="13">permission · freshness · replay · approval</text>

  <rect x="435" y="155" width="330" height="252" rx="18" fill="#fff" stroke="#171714" stroke-width="2"/>
  <text x="461" y="190" fill="#a4243b" font-size="12" letter-spacing="2">REALTIME + AUTOMATION</text>
  <text x="461" y="224" fill="#171714" font-family="Georgia,serif" font-size="24">Useful only if reality agrees.</text>
  <line x1="461" y1="244" x2="737" y2="244" stroke="#d8d8d1"/>
  <text x="461" y="278" fill="#171714" font-size="16" font-weight="700">ai-booking-workflow</text>
  <text x="461" y="309" fill="#171714" font-size="16" font-weight="700">voice-pipeline-guard</text>
  <text x="461" y="340" fill="#171714" font-size="16" font-weight="700">ubuntu-phone-compute-bridge</text>
  <text x="461" y="376" fill="#71716a" font-size="13">verified state · latency · execution proof</text>

  <rect x="812" y="155" width="330" height="252" rx="18" fill="#fff" stroke="#171714" stroke-width="2"/>
  <text x="838" y="190" fill="#4f7555" font-size="12" letter-spacing="2">MEMORY + EVIDENCE</text>
  <text x="838" y="224" fill="#171714" font-family="Georgia,serif" font-size="24">Do not let labels outrun proof.</text>
  <line x1="838" y1="244" x2="1114" y2="244" stroke="#d8d8d1"/>
  <text x="838" y="278" fill="#171714" font-size="16" font-weight="700">temporal-memory-core</text>
  <text x="838" y="309" fill="#171714" font-size="16" font-weight="700">learning-evidence-core</text>
  <text x="838" y="340" fill="#171714" font-size="16" font-weight="700">metric-integrity</text>
  <text x="838" y="376" fill="#71716a" font-size="13">time · provenance · mastery · attribution</text>
</g>

<rect x="58" y="435" width="1084" height="42" rx="10" fill="#262722"/>
<text x="80" y="462" fill="#fff" font-family="Georgia,serif" font-size="17">And then there is Relic Zero, because not every repository needs to look like a risk committee meeting.</text>
</svg>